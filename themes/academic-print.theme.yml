# Custom go-pretty-converter theme.
# Generated with: pretty-converter theme new academic-print --from academic
name: academic-print
description: "Academic, tuned for a 6x9 reference book: keeps tables and code blocks off page breaks"
extends: academic

colors:
  primary: ""      # e.g. "#1a56db" - leave empty to inherit from extends
  accent: ""
  text: ""
  muted: ""
  background: ""

fonts:
  heading: ""        # e.g. "Georgia, serif"
  body: ""
  code: ""
  google_fonts: []    # only used with --allow-network-fonts, e.g. ["Inter:400,600"]

sections:
  cover: true
  toc: true
  page_numbers: true
  header: true

density: normal        # compact | normal | relaxed

# Raw CSS appended last — wins over everything above.
css: |
  /* The rule that matters for a book like this one is on the row, not the
     table. The irregular verb table is 415 rows and runs across many
     pages, so a table has to be allowed to break. A single row must not,
     because a row split across a page boundary is unreadable: the verb
     ends at the bottom of one page and its past form at the top of the
     next. */
  tr {
    page-break-inside: avoid;
    break-inside: avoid;
  }

  /* Head and foot rows repeat on every page a long table spans, which is
     what a reader looking up a verb needs, and it is what the browser
     does by default once the rule above stops rows from splitting. */
  thead {
    display: table-header-group;
  }

  tfoot {
    display: table-footer-group;
  }

  table {
    page-break-inside: auto;
    break-inside: auto;
  }

  /* An inline code span, and a short fenced block, should move to the next
     page rather than be cut. A block too tall for one page breaks at a
     line boundary instead. */
  code,
  pre,
  pre > code {
    page-break-inside: avoid;
    break-inside: avoid;
  }

  pre {
    white-space: pre-wrap;
    word-break: break-word;
  }

