<svg xmlns="http://www.w3.org/2000/svg" width="576" height="864" viewBox="0 0 1200 1800">
  <!--
    Cover for "The Complete English Course".

    width/height are in CSS pixels and the renderer converts them at
    96px per inch, then sizes the cover page to the result. 576x864 is
    therefore exactly 6in x 9in, which is the paper. Anything else produces
    a cover page of a different size that the merge then has to reconcile,
    and the type comes out stretched.

    The viewBox is 1200x1800, the same 2:3 proportion, so the coordinates
    below are comfortable to write in while the rendered size is correct.

    Everything is vector and there are no external fonts, so the render
    does not depend on what the build machine has installed. The type is
    set in generic families with real fallbacks rather than one webfont,
    because a missing font in a cover is visible in a way a missing font
    in a body paragraph is not.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset="0.55" stop-color="#1d4a6e"/>
      <stop offset="1" stop-color="#0e2338"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b04b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8b04b"/>
      <stop offset="1" stop-color="#e8b04b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1800" fill="url(#field)"/>

  <!-- Top rule and eyebrow -->
  <rect x="150" y="220" width="900" height="3" fill="url(#rule)"/>
  <text x="600" y="300" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="34"
        letter-spacing="9" fill="#e8b04b">A2 TO C1 · SELF-STUDY</text>

  <!-- Title. 112 rather than 132: at 132 the second line overflowed the
       1200-unit width and was clipped at both edges. -->
  <text x="600" y="520" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="112"
        font-weight="bold" fill="#ffffff">THE COMPLETE</text>
  <text x="600" y="650" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="112"
        font-weight="bold" fill="#ffffff">ENGLISH COURSE</text>

  <!-- Gold rule under the title -->
  <rect x="330" y="730" width="540" height="4" fill="url(#rule)"/>

  <!-- Subtitle -->
  <text x="600" y="840" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="52"
        fill="#cfe3f2">From Zero to Fluent</text>

  <text x="600" y="940" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="38"
        fill="#a8c4da">Grammar, reading, writing and</text>
  <text x="600" y="998" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="38"
        fill="#a8c4da">5,471 flashcards in one volume</text>

  <!-- The proof points. Each one is a number a reader can check against
       the book, which is why they are numbers and not adjectives. -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="300" y="1250" font-size="82" font-weight="bold" fill="#e8b04b">1,126</text>
    <text x="300" y="1310" font-size="28" fill="#cfe3f2">PAGES</text>

    <text x="600" y="1250" font-size="82" font-weight="bold" fill="#e8b04b">415</text>
    <text x="600" y="1310" font-size="28" fill="#cfe3f2">IRREGULAR VERBS</text>

    <text x="900" y="1250" font-size="82" font-weight="bold" fill="#e8b04b">5,471</text>
    <text x="900" y="1310" font-size="28" fill="#cfe3f2">FLASHCARDS</text>
  </g>

  <g stroke="#e8b04b" stroke-width="1" opacity="0.5">
    <line x1="450" y1="1205" x2="450" y2="1325"/>
    <line x1="750" y1="1205" x2="750" y2="1325"/>
  </g>

  <!-- Author. The ruled lines sit below this and were originally at
       y=1500..1680, which ran straight through the author's name. -->
  <text x="600" y="1560" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="46"
        fill="#ffffff">Omar Flores</text>
  <text x="600" y="1622" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="26"
        letter-spacing="4" fill="#8fa9c0">OPEN SOURCE · MIT LICENCE</text>

  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <line x1="200" y1="1690" x2="1000" y2="1690"/>
    <line x1="260" y1="1730" x2="940" y2="1730"/>
    <line x1="320" y1="1770" x2="880" y2="1770"/>
  </g>
</svg>

