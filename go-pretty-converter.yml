# go-pretty-converter configuration
# https://github.com/sazardev/go-pretty-converter
#
# Documents are ordered by their [X.Y.Z] frontmatter id, not by filename,
# so the numbering in the frontmatter is the real table of contents.

source: ./book
out: ./out/english-from-zero-to-fluent
theme: academic-print
language: en
density: relaxed

title: "English: From Zero to Fluent"
subtitle: "A complete, planned course in one volume"
author: "English from Zero to Fluent"

# 6x9 is the trim size print-on-demand services expect.
# The book is written to a 1000-page target; see PLAN.md for the budget.
paper: 6x9in

# The build runs an automatic quality audit afterwards. It is advisory and
# never fails the build, and there is no --strict flag, so a warning count
# in the log is a thing to read, not a gate.
#
# One warning is expected, and with this theme it is
#
#   [page-break-inside-risk] <table> has no page-break-inside: avoid and may
#   be split across pages mid-row
#
# The advice is wrong for this book. The full irregular verb table is 415
# rows and runs for many pages, so page-break-inside: avoid on a table would
# mean refusing to render it. The theme sets table to auto and sets avoid on
# the row instead, which is the part that actually matters: a single row
# never splits across a page boundary. The audit checks the table element
# and reports the missing declaration, and it does not read the theme's CSS
# to notice that the row rule is already there. All seventeen built-in
# themes carry the same warning for the same reason.
#
# The count of these warnings is not stable, because the audit is measuring
# where a block lands in the rendered page. It appears and disappears as the
# prose above it changes length. It is not a signal about the source.
