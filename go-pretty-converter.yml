# go-pretty-converter configuration
# https://github.com/sazardev/go-pretty-converter
#
# Documents are ordered by their [X.Y.Z] frontmatter id, not by filename,
# so the numbering in the frontmatter is the real table of contents.

source: ./book
out: ./out/english-from-zero-to-fluent
theme: academic-print
language: en
density: relaxed

title: "English: From Zero to Fluent"
subtitle: "A complete, planned course in one volume"
author: "English from Zero to Fluent"

# 6x9 is the trim size print-on-demand services expect.
paper: 6x9in

# The build runs an automatic quality audit afterwards. It is advisory and
# never fails the build, and there is no --strict flag, so a warning count
# in the log is a thing to read, not a gate.
#
# One warning is expected and is not a defect in the source:
#
#   [page-break-inside-risk] <code> has no page-break-inside: avoid
#
# It is a layout heuristic, not a CSS check. All seventeen built-in themes
# raise it identically and none of them carries the declaration it claims
# is missing, and appending the declaration to a custom theme does not
# silence it, so it cannot be fixed from the stylesheet. It fires or not
# depending on where a fenced block happens to fall in the rendered page,
# which is why it appears and disappears as the prose above it changes.
# The blocks it flags are diagrams, and a diagram that moves to the next
# page is the correct outcome anyway.
